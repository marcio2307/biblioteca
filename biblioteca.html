<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta
    name="description"
    content="Biblioteca O Culta"
  >

  <title>Biblioteca O Culta</title>

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;

      background: #ffffff;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;

      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #ffffff;

      color: #174d35;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       PÁGINA
       ========================================================= */

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      background: #ffffff;
    }

    .main {
      width: 100%;
      flex: 1;

      padding:
        max(28px, env(safe-area-inset-top))
        0
        24px;
    }

    .container {
      width: min(100% - 32px, 1080px);

      margin: 0 auto;
    }


    /* =========================================================
       CABEÇALHO
       ========================================================= */

    .brand {
      display: flex;
      align-items: center;

      gap: 16px;

      margin-bottom: 26px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      object-fit: cover;

      border-radius: 12px;

      border: 2px solid #d7e8de;

      background: #f7fbf8;

      box-shadow:
        0 5px 18px rgba(22, 78, 53, 0.10);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;

      color: #174d35;

      font-size: clamp(24px, 3vw, 31px);

      line-height: 1.15;

      font-weight: 700;

      letter-spacing: -0.3px;

      overflow-wrap: anywhere;
    }


    /* =========================================================
       CARD PRINCIPAL
       ========================================================= */

    .library {
      width: 100%;

      overflow: hidden;

      background: #ffffff;

      border: 1px solid #d9e5de;

      border-radius: 15px;

      box-shadow:
        0 8px 28px rgba(23, 77, 53, 0.08),
        0 2px 8px rgba(23, 77, 53, 0.04);
    }


    /* =========================================================
       CABEÇALHO DOS LINKS
       ========================================================= */

    .section-header {
      min-height: 70px;

      display: flex;
      align-items: center;

      gap: 14px;

      padding: 14px 18px;

      background: #f8fbf9;

      border-left: 6px solid #176b45;

      border-bottom: 1px solid #d9e5de;
    }

    .section-icon {
      width: 36px;
      height: 36px;

      flex: 0 0 36px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: #e8f3ed;

      color: #176b45;

      font-size: 17px;

      line-height: 1;
    }

    .section-info {
      min-width: 0;

      flex: 1;
    }

    .section-title {
      display: block;

      color: #174d35;

      font-size: 16px;

      line-height: 1.25;

      font-weight: 700;
    }

    .section-subtitle {
      display: block;

      margin-top: 3px;

      color: #5d796b;

      font-size: 13px;

      line-height: 1.25;
    }

    .count {
      min-width: 32px;
      height: 32px;

      padding: 0 9px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 999px;

      background: #e8f3ed;

      color: #176b45;

      font-size: 13px;

      font-weight: 700;
    }


    /* =========================================================
       LISTA
       ========================================================= */

    .links {
      padding: 8px;
    }

    .link {
      width: 100%;

      min-height: 62px;

      display: flex;
      align-items: center;

      padding: 10px 14px;

      margin: 2px 0;

      border-radius: 10px;

      color: #174d35;

      background: #ffffff;

      text-decoration: none;

      font-size: 15px;

      line-height: 1.3;

      border: 1px solid transparent;

      transition:
        background-color 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;

      touch-action: manipulation;
    }

    .doc-icon {
      width: 34px;

      flex: 0 0 34px;

      color: #176b45;

      font-size: 17px;

      line-height: 1;
    }

    .link-label {
      min-width: 0;

      overflow-wrap: anywhere;

      font-weight: 500;
    }


    /* =========================================================
       EFEITO NO PC
       ========================================================= */

    @media (hover: hover) and (pointer: fine) {

      .link:hover {
        background: #f0f8f4;

        color: #0e5a38;

        border-color: #cfe3d7;

        transform: translateX(2px);

        box-shadow:
          0 3px 10px rgba(23, 107, 69, 0.06);
      }

      .link:hover .doc-icon {
        color: #0e5a38;
      }

    }


    /* =========================================================
       TOQUE
       ========================================================= */

    .link:active {
      background: #eaf5ef;

      color: #0e5a38;

      border-color: #c7dfd0;
    }

    .link:focus-visible {
      outline: 2px solid #176b45;

      outline-offset: -2px;

      background: #f0f8f4;
    }


    /* =========================================================
       CELULARES
       ========================================================= */

    @media (max-width: 480px) {

      .container {
        width: calc(100% - 20px);
      }

      .main {
        padding-top:
          max(18px, env(safe-area-inset-top));

        padding-bottom: 18px;
      }

      .brand {
        gap: 12px;

        margin-bottom: 18px;
      }

      .brand-logo {
        width: 58px;
        height: 58px;

        flex-basis: 58px;

        border-radius: 10px;
      }

      .brand-title {
        font-size: 22px;
      }

      .library {
        border-radius: 12px;
      }

      .section-header {
        min-height: 66px;

        gap: 10px;

        padding: 12px;

        border-left-width: 5px;
      }

      .section-icon {
        width: 34px;
        height: 34px;

        flex-basis: 34px;
      }

      .links {
        padding: 5px;
      }

      .link {
        min-height: 58px;

        padding: 9px 10px;

        font-size: 15px;

        border-radius: 8px;
      }

      .doc-icon {
        width: 32px;

        flex-basis: 32px;
      }

    }


    /* =========================================================
       TABLETS
       ========================================================= */

    @media (min-width: 601px) and (max-width: 1024px) {

      .container {
        width: 92%;

        max-width: 900px;
      }

      .main {
        padding-top: 34px;
      }

      .brand {
        margin-bottom: 26px;
      }

      .library {
        border-radius: 16px;
      }

      .link {
        min-height: 64px;
      }

    }


    /* =========================================================
       COMPUTADORES GRANDES
       ========================================================= */

    @media (min-width: 1200px) {

      .main {
        padding-top: 42px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .library {
        border-radius: 16px;
      }

    }


    /* =========================================================
       ACESSIBILIDADE
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .link {
        transition: none;
      }

    }

  </style>
</head>


<body>

  <div class="page">

    <main class="main">

      <div class="container">


        <!-- ================================================
             TÍTULO
             ================================================ -->

        <header class="brand">

          <img
            class="brand-logo"
            src="logo.png"
            alt="Logo da Biblioteca O Culta"
            width="72"
            height="72"
            decoding="async"
          >

          <div class="brand-text">

            <h1 class="brand-title">
              Biblioteca O Culta
            </h1>

          </div>

        </header>


        <!-- ================================================
             BIBLIOTECA
             ================================================ -->

        <section
          class="library"
          aria-label="Biblioteca"
        >


          <!-- CABEÇALHO -->

          <div class="section-header">

            <div
              class="section-icon"
              aria-hidden="true"
            >
              ▤
            </div>


            <div class="section-info">

              <strong class="section-title">
                Links
              </strong>

              <span class="section-subtitle">
                4 aulas
              </span>

            </div>


            <span
              class="count"
              aria-label="4 aulas"
            >
              4
            </span>

          </div>


          <!-- ================================================
               LINKS
               ================================================ -->

          <nav
            class="links"
            aria-label="Aulas"
          >


            <!-- PARTE 1 -->

            <a
              class="link"
              href="https://drive.google.com/drive/folders/1EFHGdPDzA-NeI_mnz2gW9fgUFK6zDKsC"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir Parte 1"
            >

              <span
                class="doc-icon"
                aria-hidden="true"
              >
                ▤
              </span>

              <span class="link-label">
                Parte 1
              </span>

            </a>


            <!-- PARTE 2 -->

            <a
              class="link"
              href="https://drive.google.com/drive/folders/1WgFmdW5c-aWfmutRsC8Big_Z_fGwv5U7"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir Parte 2"
            >

              <span
                class="doc-icon"
                aria-hidden="true"
              >
                ▤
              </span>

              <span class="link-label">
                Parte 2
              </span>

            </a>


            <!-- PARTE 3 -->

            <a
              class="link"
              href="https://drive.google.com/drive/folders/1-8h-pY-GBIsPjUgZryQCAyRrcoYE2zq8"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir Parte 3"
            >

              <span
                class="doc-icon"
                aria-hidden="true"
              >
                ▤
              </span>

              <span class="link-label">
                Parte 3
              </span>

            </a>


            <!-- PARTE 4 -->

            <a
              class="link"
              href="https://drive.google.com/drive/folders/18fNIYZViYDzy_AapG4rjrcHQGALY1q74"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Abrir Parte 4"
            >

              <span
                class="doc-icon"
                aria-hidden="true"
              >
                ▤
              </span>

              <span class="link-label">
                Parte 4
              </span>

            </a>


          </nav>

        </section>

      </div>

    </main>

  </div>

</body>
</html>
